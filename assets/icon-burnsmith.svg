<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="60%" stop-color="#0a0d15"/>
      <stop offset="100%" stop-color="#040609"/>
    </radialGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff7700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1c71" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Disc Sheen & Material -->
    <linearGradient id="discSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="25%" stop-color="#134074"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#1d2d44"/>
      <stop offset="100%" stop-color="#051923"/>
    </linearGradient>

    <linearGradient id="discRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9b51e0" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Forge Fire Gradients -->
    <linearGradient id="fireOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff1a00"/>
      <stop offset="40%" stop-color="#ff6600"/>
      <stop offset="75%" stop-color="#ffae00"/>
      <stop offset="100%" stop-color="#fff275"/>
    </linearGradient>

    <linearGradient id="fireInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3c00"/>
      <stop offset="50%" stop-color="#ff8c00"/>
      <stop offset="90%" stop-color="#fff6a2"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Blue-ray Laser Flame Gradient -->
    <linearGradient id="laserFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1800ad"/>
      <stop offset="45%" stop-color="#0066ff"/>
      <stop offset="80%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Hammer Steel Gradients -->
    <linearGradient id="steelHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="25%" stop-color="#bcccdc"/>
      <stop offset="55%" stop-color="#486581"/>
      <stop offset="85%" stop-color="#243b53"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>

    <linearGradient id="steelBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="30%" stop-color="#ffd166"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3826"/>
      <stop offset="40%" stop-color="#995838"/>
      <stop offset="70%" stop-color="#ba7048"/>
      <stop offset="100%" stop-color="#422517"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Container -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Background Forge Ambient Glow -->
  <circle cx="230" cy="300" r="140" fill="#ff4500" opacity="0.16" filter="url(#superGlow)"/>
  <circle cx="280" cy="240" r="110" fill="#00d4ff" opacity="0.22" filter="url(#superGlow)"/>

  <!-- ================= BLU-RAY DISC ================= -->
  <g id="discGroup">
    <!-- Disc Outer Shadow/Glow -->
    <circle cx="256" cy="275" r="128" fill="#000000" opacity="0.45"/>
    
    <!-- Outer Rim -->
    <circle cx="256" cy="275" r="125" fill="url(#discSheen)" stroke="#00f2fe" stroke-width="2.5" opacity="0.95"/>

    <!-- Specular Prismatic Reflections -->
    <path d="M 256 275 L 175 180 A 125 125 0 0 1 295 152 Z" fill="#00f2fe" opacity="0.32" />
    <path d="M 256 275 L 340 370 A 125 125 0 0 1 215 398 Z" fill="#9b51e0" opacity="0.28" />
    <path d="M 256 275 L 140 320 A 125 125 0 0 1 150 210 Z" fill="#ff7700" opacity="0.25" />

    <!-- Disc Grooves -->
    <circle cx="256" cy="275" r="114" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>
    <circle cx="256" cy="275" r="102" fill="none" stroke="url(#discRing)" stroke-width="1.8" opacity="0.45"/>
    <circle cx="256" cy="275" r="90" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.2"/>
    <circle cx="256" cy="275" r="76" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.35"/>
    <circle cx="256" cy="275" r="62" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.25"/>

    <!-- Clear Inner Hub Ring -->
    <circle cx="256" cy="275" r="48" fill="#0b1728" stroke="#38bdf8" stroke-width="2" opacity="0.85"/>
    <circle cx="256" cy="275" r="32" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

    <!-- Center Spindle Hole -->
    <circle cx="256" cy="275" r="20" fill="#070a10" stroke="#00f2fe" stroke-width="2.2"/>
    <circle cx="256" cy="275" r="8" fill="#000000"/>
  </g>

  <!-- ================= FORGE FLAMES (Wrapping & Rising) ================= -->
  <!-- Left Forge Flame Tongue (Gold/Orange/Red) -->
  <path d="M 170 370 C 130 350 110 300 120 250 C 126 220 144 195 148 165 C 152 135 138 115 152 85 C 168 120 184 140 180 175 C 196 150 205 125 224 100 C 220 135 228 165 240 185 C 248 165 258 150 270 135 C 266 170 254 200 248 220 C 265 205 285 195 305 190 C 285 220 268 250 260 280 C 240 350 200 380 170 370 Z" 
        fill="url(#fireOuter)" opacity="0.88" filter="url(#glowEffect)"/>

  <!-- Left Inner Flame Core -->
  <path d="M 165 350 C 140 330 130 295 138 255 C 144 230 160 210 164 185 C 172 210 182 225 180 250 C 194 230 204 205 218 180 C 216 210 224 235 230 250 C 220 290 195 355 165 350 Z" 
        fill="url(#fireInner)" opacity="0.95"/>

  <!-- Right Blu-ray High-Tech Laser Flame (Cyan / Royal Blue) -->
  <path d="M 330 360 C 375 330 395 280 385 225 C 378 190 355 165 358 130 C 360 100 375 80 365 55 C 342 95 330 120 335 155 C 318 130 308 105 288 80 C 295 115 285 145 272 170 C 285 185 300 205 310 230 C 322 260 328 300 330 360 Z" 
        fill="url(#laserFlame)" opacity="0.85" filter="url(#glowEffect)"/>

  <!-- Core Laser Flame Highlight -->
  <path d="M 340 330 C 365 300 372 260 364 220 C 356 190 342 170 345 145 C 330 175 320 200 325 230 C 315 250 310 280 320 310 C 326 325 333 325 340 330 Z" 
        fill="#e0f7ff" opacity="0.9"/>

  <!-- ================= BLACKSMITH HAMMER (La Forge) ================= -->
  <!-- Hammer Angle: Striking from upper-right down onto the optical disc -->
  <g transform="rotate(-32 290 190)">
    <!-- Hammer Handle -->
    <path d="M 282 30 L 298 30 L 294 210 L 286 210 Z" fill="url(#handleGrad)" stroke="#20110a" stroke-width="1.5"/>
    <!-- Handle Grip Straps / Forge Wire Wrap -->
    <rect x="282.5" y="60" width="15" height="4" rx="1.5" fill="#d4af37" opacity="0.8"/>
    <rect x="283" y="75" width="14" height="4" rx="1.5" fill="#d4af37" opacity="0.8"/>
    <rect x="283.5" y="90" width="13" height="4" rx="1.5" fill="#d4af37" opacity="0.8"/>
    <rect x="284" y="105" width="12" height="4" rx="1.5" fill="#d4af37" opacity="0.8"/>
    <circle cx="290" cy="30" r="9" fill="#2d3748" stroke="#a0aec0" stroke-width="1.5"/>

    <!-- Hammer Head Group -->
    <g id="hammerHead">
      <!-- Main Head Block -->
      <path d="M 245 185 L 335 185 L 340 235 L 240 235 Z" fill="url(#steelHead)" stroke="#4a5568" stroke-width="2"/>
      
      <!-- Striking Face (Beveled & Heated from Disc Impact) -->
      <path d="M 240 235 L 340 235 L 332 252 L 248 252 Z" fill="url(#steelBevel)"/>
      <rect x="250" y="250" width="80" height="4" rx="2" fill="#ffffff" filter="url(#glowEffect)"/>

      <!-- Peen / Back of Hammer (Cross-peen / Chisel back) -->
      <path d="M 260 185 L 320 185 L 305 155 L 275 155 Z" fill="url(#steelHead)" stroke="#2d3748" stroke-width="1.5"/>
      <line x1="275" y1="155" x2="305" y2="155" stroke="#e2e8f0" stroke-width="2"/>

      <!-- Central Wedge / Eye Collar -->
      <rect x="278" y="180" width="24" height="60" rx="3" fill="#1a202c" opacity="0.6"/>
      <circle cx="290" cy="210" r="4" fill="#00e5ff" filter="url(#glowEffect)"/>
    </g>
  </g>

  <!-- ================= IMPACT FORGE SPARKS & PARTICLES ================= -->
  <!-- Impact Center at Disc Strike Point (~250, 230) -->
  <g id="impactSparks" filter="url(#glowEffect)">
    <!-- Primary Impact Flash -->
    <ellipse cx="250" cy="225" rx="35" ry="16" fill="#ffffff" transform="rotate(-15 250 225)"/>
    <ellipse cx="250" cy="225" rx="55" ry="8" fill="#00ffff" transform="rotate(-15 250 225)" opacity="0.85"/>
    <circle cx="250" cy="225" r="14" fill="#ffea79"/>

    <!-- Starburst Laser Flares -->
    <path d="M 250 185 L 253 225 L 290 225 L 255 228 L 250 265 L 246 228 L 210 225 L 247 222 Z" fill="#ffffff"/>
    <path d="M 250 195 L 252 225 L 278 225 L 254 227 L 250 255 L 247 227 L 222 225 L 248 223 Z" fill="#00f2fe"/>

    <!-- Flying Sparks (Forging Fire & Blu-ray Laser Embers) -->
    <!-- Hot Orange Sparks -->
    <circle cx="215" cy="180" r="4.5" fill="#ffbb00"/>
    <circle cx="190" cy="195" r="3" fill="#ff5500"/>
    <circle cx="165" cy="225" r="3.5" fill="#ffa200"/>
    <circle cx="180" cy="150" r="2.5" fill="#ffdd00"/>
    <circle cx="205" cy="120" r="3" fill="#ff3700"/>
    <circle cx="230" cy="95" r="2" fill="#ffcc00"/>
    <circle cx="140" cy="270" r="3" fill="#ff7700"/>

    <!-- Cyan / Blue Sparks -->
    <circle cx="295" cy="190" r="4" fill="#00f2fe"/>
    <circle cx="325" cy="180" r="3.2" fill="#38bdf8"/>
    <circle cx="350" cy="210" r="2.5" fill="#818cf8"/>
    <circle cx="310" cy="140" r="3.5" fill="#00e5ff"/>
    <circle cx="340" cy="115" r="2" fill="#a78bfa"/>
    <circle cx="280" cy="110" r="2.5" fill="#38bdf8"/>
    <circle cx="370" cy="245" r="3" fill="#00f2fe"/>

    <!-- Diamond Molten Flecks -->
    <polygon points="210,165 214,168 210,171 206,168" fill="#ffffff"/>
    <polygon points="305,160 309,164 305,168 301,164" fill="#ffffff"/>
    <polygon points="270,125 273,128 270,131 267,128" fill="#ffe066"/>
  </g>

  <!-- ================= SUBTLE ANVIL HORIZON BASE ================= -->
  <path d="M 120 425 L 392 425 C 380 438 350 445 256 445 C 162 445 132 438 120 425 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="256" cy="425" rx="136" ry="6" fill="#00e5ff" opacity="0.3" filter="url(#glowEffect)"/>
</svg>

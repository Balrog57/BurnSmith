<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="160" height="120">
		<defs>
			<filter id="shadowFilter">
				<feGaussianBlur stdDeviation="3" />
			</filter>
		</defs>
		<use id="shadow" xlink:href="#rect" x="2" y="2" style="visibility:hidden;fill:none;stroke:#404040;filter:url(#shadowFilter)" />
		<g id="main" stroke="#0000FF" fill="none">
			<rect id="rect" x="5%" y="5%" width="90%" height="90%" rx="5" ry="5" stroke-width="5" />
		</g>
	</svg>
	
<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="160" height="120">
		<defs>
			<clipPath id="cp">
				<ellipse cx="50%" cy="50%" rx="45%" ry="45%" />
			</clipPath>
			<filter id="shadowFilter">
				<feGaussianBlur stdDeviation="3" />
			</filter>
		</defs>
		<use id="shadow" xlink:href="#ellipse" x="2" y="2" style="visibility:hidden;fill:none;stroke:#404040;filter:url(#shadowFilter)" />
	    <g id="main" stroke="#FFFFFF" fill="none">
			<ellipse id="ellipse" cx="50%" cy="50%" rx="45%" ry="45%" stroke-width="5" fill="none" />
		</g>
	</svg>
	
<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="220" height="60">
		<defs>
			<filter id="shadowFilter">
				<feGaussianBlur stdDeviation="3" />
			</filter>
		</defs>
		<circle id="circle" cx="15" cy="50%" r="5" fill="#FF0000" />
		<use id="shadow" xlink:href="#text" x="2" y="2" style="visibility:hidden;fill:#404040;filter:url(#shadowFilter)" />
		<g id="gText" fill="#FFFFFF">
			<text id="text" x="30" y="50%" style="font-size:26;font-style:normal;font-weight:normal;" text-anchor="left" dominant-baseline="middle" />
		</g>
	</svg>
	
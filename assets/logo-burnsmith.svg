<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0d15"/>
      <stop offset="50%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff7700" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Disc Gradients -->
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="35%" stop-color="#134074"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="65%" stop-color="#1d2d44"/>
      <stop offset="100%" stop-color="#051923"/>
    </linearGradient>

    <linearGradient id="discGlowRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Fire Gradients -->
    <linearGradient id="logoFireOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff1a00"/>
      <stop offset="45%" stop-color="#ff7700"/>
      <stop offset="85%" stop-color="#ffbe00"/>
      <stop offset="100%" stop-color="#fff885"/>
    </linearGradient>

    <linearGradient id="logoFireInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3c00"/>
      <stop offset="60%" stop-color="#ffae00"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Laser Fire Gradient -->
    <linearGradient id="logoLaserFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#100082"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Hammer Head Gradient -->
    <linearGradient id="logoSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="logoSteelBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="logoHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#361304"/>
    </linearGradient>

    <!-- Typography Gradients -->
    <linearGradient id="textBurn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffdd80"/>
      <stop offset="75%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="textSmith" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect x="0" y="0" width="960" height="300" rx="24" fill="url(#bgBanner)"/>
  <rect x="1" y="1" width="958" height="298" rx="23" fill="none" stroke="url(#bannerBorder)" stroke-width="1.5"/>

  <!-- Ambient Light Halos -->
  <circle cx="160" cy="150" r="120" fill="#00d4ff" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="130" cy="170" r="100" fill="#ff4500" opacity="0.14" filter="url(#softGlow)"/>

  <!-- ================= LEFT EMBLEM / ICON (Scale & Center ~150, 150) ================= -->
  <g transform="translate(-10, -5)">
    <!-- BLU-RAY DISC -->
    <g id="disc">
      <circle cx="160" cy="155" r="88" fill="url(#discGrad)" stroke="#00f2fe" stroke-width="2"/>
      
      <!-- Prismatic Reflections -->
      <path d="M 160 155 L 105 85 A 88 88 0 0 1 185 68 Z" fill="#00f2fe" opacity="0.35"/>
      <path d="M 160 155 L 215 225 A 88 88 0 0 1 135 242 Z" fill="#9b51e0" opacity="0.3"/>
      <path d="M 160 155 L 80 185 A 88 88 0 0 1 85 110 Z" fill="#ff7700" opacity="0.25"/>

      <!-- Concentric Grooves -->
      <circle cx="160" cy="155" r="80" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.2"/>
      <circle cx="160" cy="155" r="72" fill="none" stroke="url(#discGlowRing)" stroke-width="1.4" opacity="0.5"/>
      <circle cx="160" cy="155" r="62" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
      <circle cx="160" cy="155" r="52" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.4"/>
      <circle cx="160" cy="155" r="42" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

      <!-- Center Spindle Rings -->
      <circle cx="160" cy="155" r="32" fill="#0a1526" stroke="#38bdf8" stroke-width="1.8"/>
      <circle cx="160" cy="155" r="22" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.5"/>
      <circle cx="160" cy="155" r="14" fill="#04060a" stroke="#00f2fe" stroke-width="1.5"/>
      <circle cx="160" cy="155" r="6" fill="#000000"/>
    </g>

    <!-- FORGE FLAME (Left) -->
    <path d="M 100 220 C 72 205 60 170 66 135 C 70 115 82 98 85 78 C 88 56 78 42 88 22 C 100 46 110 60 108 85 C 120 66 126 50 140 32 C 137 57 142 78 150 92 C 156 78 163 67 172 56 C 168 81 160 102 155 116 C 168 105 182 98 196 95 C 182 116 170 137 164 158 C 150 208 122 228 100 220 Z" 
          fill="url(#logoFireOuter)" opacity="0.88" filter="url(#logoGlow)"/>

    <path d="M 96 205 C 78 190 72 165 77 138 C 81 120 92 106 95 89 C 101 106 108 116 106 134 C 116 120 123 103 133 85 C 131 106 137 124 141 134 C 134 163 117 210 96 205 Z" 
          fill="url(#logoFireInner)" opacity="0.95"/>

    <!-- HIGH-TECH LASER FLAME (Right) -->
    <path d="M 210 215 C 242 195 256 160 250 120 C 245 95 230 78 232 52 C 234 32 244 18 237 0 C 220 28 212 45 215 70 C 203 52 196 34 182 16 C 187 41 180 62 170 80 C 180 90 190 105 198 122 C 206 144 210 172 210 215 Z" 
          fill="url(#logoLaserFlame)" opacity="0.85" filter="url(#logoGlow)"/>

    <!-- BLACKSMITH HAMMER (Striking Disc) -->
    <g transform="rotate(-34 185 95)">
      <!-- Handle -->
      <path d="M 179 -15 L 191 -15 L 188 110 L 182 110 Z" fill="url(#logoHandle)" stroke="#20110a" stroke-width="1"/>
      <rect x="179.5" y="10" width="10" height="3" rx="1" fill="#d4af37" opacity="0.8"/>
      <rect x="180" y="22" width="9.5" height="3" rx="1" fill="#d4af37" opacity="0.8"/>
      <rect x="180.5" y="34" width="9" height="3" rx="1" fill="#d4af37" opacity="0.8"/>
      <circle cx="185" cy="-15" r="6" fill="#334155"/>

      <!-- Hammer Head -->
      <path d="M 152 92 L 218 92 L 222 130 L 148 130 Z" fill="url(#logoSteel)" stroke="#475569" stroke-width="1.5"/>
      <path d="M 148 130 L 222 130 L 216 143 L 154 143 Z" fill="url(#logoSteelBevel)"/>
      <rect x="156" y="141" width="58" height="3" rx="1" fill="#ffffff" filter="url(#logoGlow)"/>

      <!-- Peen -->
      <path d="M 163 92 L 207 92 L 196 70 L 174 70 Z" fill="url(#logoSteel)" stroke="#334155" stroke-width="1"/>

      <!-- Eye / Wedge -->
      <rect x="176" y="88" width="18" height="44" rx="2" fill="#0f172a" opacity="0.6"/>
      <circle cx="185" cy="110" r="3" fill="#00e5ff" filter="url(#logoGlow)"/>
    </g>

    <!-- Impact Flare & Sparks -->
    <ellipse cx="155" cy="120" rx="25" ry="10" fill="#ffffff" transform="rotate(-15 155 120)" filter="url(#logoGlow)"/>
    <circle cx="155" cy="120" r="8" fill="#ffea79"/>
    
    <!-- Sparks -->
    <circle cx="128" cy="85" r="3" fill="#ffaa00" filter="url(#logoGlow)"/>
    <circle cx="108" cy="100" r="2.2" fill="#ff5500"/>
    <circle cx="140" cy="55" r="2" fill="#ffea00"/>
    <circle cx="190" cy="90" r="2.8" fill="#00f2fe" filter="url(#logoGlow)"/>
    <circle cx="210" cy="80" r="2.2" fill="#38bdf8"/>
    <circle cx="205" cy="55" r="2.5" fill="#a855f7"/>
  </g>

  <!-- ================= TYPOGRAPHY / BRANDING ================= -->
  <g transform="translate(315, 0)">
    <!-- Main Title: BURNSMITH -->
    <text x="0" y="152" font-family="'Segoe UI', 'Montserrat', 'Inter', 'Helvetica Neue', sans-serif" font-size="78" font-weight="900" letter-spacing="4">
      <tspan fill="url(#textBurn)">BURN</tspan><tspan fill="url(#textSmith)">SMITH</tspan>
    </text>

    <!-- Laser Accent Rule / Divider Line -->
    <g transform="translate(2, 175)">
      <!-- Gradient Line -->
      <rect x="0" y="0" width="570" height="3" rx="1.5" fill="url(#bannerBorder)"/>
      <rect x="0" y="0" width="160" height="3" rx="1.5" fill="#ff6600" opacity="0.9" filter="url(#logoGlow)"/>
      <rect x="160" y="0" width="220" height="3" rx="1.5" fill="#00f2fe" opacity="0.9" filter="url(#logoGlow)"/>
      <!-- Glowing Diamond Center Spark -->
      <polygon points="160,-3 166,1.5 160,6 154,1.5" fill="#ffffff" filter="url(#logoGlow)"/>
    </g>

    <!-- Subtitle: LA FORGE DU BLU-RAY -->
    <text x="6" y="218" font-family="'Segoe UI', 'Montserrat', 'Inter', 'Roboto', sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="url(#subTextGrad)">
      LA FORGE DU BLU-RAY
    </text>

    <!-- Technical Badges / Formats tag -->
    <g transform="translate(6, 240)">
      <!-- BD / 4K / DVD Tag Pills -->
      <rect x="0" y="0" width="82" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="41" y="15" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">BLU-RAY</text>

      <rect x="94" y="0" width="70" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="129" y="15" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="1.5">4K UHD</text>

      <rect x="176" y="0" width="55" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="203.5" y="15" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#a855f7" text-anchor="middle" letter-spacing="1.5">DVD</text>

      <rect x="243" y="0" width="115" height="22" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="300.5" y="15" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">MENUS &amp; ISO</text>
    </g>
  </g>
</svg>

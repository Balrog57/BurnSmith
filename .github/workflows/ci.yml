name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Cache the tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/ffmpeg
            tools/tsmuxer
            tools/dovi_tool
            tools/hdr10plus_tool
          key: tools-ffmpeg-8.1.1-49b28c5f-tsmuxer-bdmvauthor-0.1.133-34814ab3-dovi-2.3.4-hdr10plus-1.7.2

      # in tools\ the dev build finds them by its parent walk, before anything on the runner's PATH; a hash that differs stops the job
      - name: Fetch ffmpeg, ffprobe and tsMuxeR, dovi_tool and hdr10plus_tool
        run: |
          $tar = "$env:SystemRoot\System32\tar.exe" # the runner's PATH may give Git's, which cannot read a zip
          function Fetch($url, $zip, $sha256) {
            curl.exe -fsSL --retry 3 -o $zip $url
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $sha256) { throw "$url is not the pinned file" }
          }
          if (-not (Test-Path tools\ffmpeg\ffmpeg.exe)) {
            New-Item -ItemType Directory -Force tools\ffmpeg | Out-Null
            Fetch https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-full_build.zip tools\ffmpeg.zip 49B28C5F16ADDD40239A66949973458769B7056FB7752C30AC0D53389D09A552
            & $tar -xf tools\ffmpeg.zip -C tools\ffmpeg --strip-components=2 ffmpeg-8.1.1-full_build/bin/ffmpeg.exe ffmpeg-8.1.1-full_build/bin/ffprobe.exe
            Remove-Item tools\ffmpeg.zip
          }
          if (-not (Test-Path tools\tsmuxer\bin\tsMuxeR.exe)) {
            New-Item -ItemType Directory -Force tools\tsmuxer\bin | Out-Null
            # tsMuxeR as BDMV Author patched and built it (native menu track, insertSEI start delay), with its four DLLs: taken out of its NSIS setup, which is not run
            Fetch https://github.com/blenheimears/bdmvauthor/releases/download/0.1.133/bdmvauthor-0.1.133-windows-ucrt64-setup.exe tools\bdmvauthor-setup.exe 34814AB3E15DC9115D0992DEF7EEFBA5A39164CEA37D823DE8B701B8C02FBEA6
            7z e -y -otools\tsmuxer\bin tools\bdmvauthor-setup.exe tsmuxer.exe libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll zlib1.dll
            if ($LASTEXITCODE -ne 0) { throw '7z could not open the BDMV Author setup' }
            Remove-Item tools\bdmvauthor-setup.exe
          }
          foreach ($t in @(@('dovi_tool', 'https://github.com/quietvoid/dovi_tool/releases/download/2.3.4/dovi_tool-2.3.4-x86_64-pc-windows-msvc.zip', '0D9733D311DFE49F9DCA0C350F7E6D978182673D333C6F07F7365DAF9E6C81EB'),
                           @('hdr10plus_tool', 'https://github.com/quietvoid/hdr10plus_tool/releases/download/1.7.2/hdr10plus_tool-1.7.2-x86_64-pc-windows-msvc.zip', '82B2D560073941B14C6511A431F429E33E134E5CAEFB60D7E8F6F6E6DA8E16BA'))) {
            if (-not (Test-Path "tools\$($t[0])\$($t[0]).exe")) {
              New-Item -ItemType Directory -Force "tools\$($t[0])" | Out-Null
              Fetch $t[1] "tools\$($t[0]).zip" $t[2]
              & $tar -xf "tools\$($t[0]).zip" -C "tools\$($t[0])" "$($t[0]).exe"
              Remove-Item "tools\$($t[0]).zip"
            }
          }
          $pins = @{ 'ffmpeg.exe' = '09948D4CDD0650DA6FF5A87577469F2A218DC2615AE379F8F734D24C49DE0F73'; 'ffprobe.exe' = 'A6618E99BB58869DED3C6F37B53AA1A8D701C3591DBB7B5B317D47369C112BE2' }
          foreach ($tool in $pins.Keys) {
            if ((Get-FileHash tools\ffmpeg\$tool -Algorithm SHA256).Hash -ne $pins[$tool]) { throw "$tool is not the pinned build" }
          }
          $pins = @{ 'tsMuxeR.exe' = '785C40C2B232B3F167D9C58842EB688C354FC289C09E9C7B8A057D644E540F31'; 'libgcc_s_seh-1.dll' = '266670EA259731F061D77A1EE6721266C8D1EF8200C15BB09ADB65C86EAC8591'; 'libstdc++-6.dll' = '0C7C8EFE66A3879AE6200CC3B0709647DFCBE7E0AA19F1F6EEA030B1229E8C5E'; 'libwinpthread-1.dll' = '2225E5C6887837D58E8CEEC7380A95D9EB74D8DF49B24A787EE5BC864C0FA279'; 'zlib1.dll' = 'A6BDF5EECC69D86264820F45D04FC9B8113DAC7EDC4C34377DFF05E2F27DDF7B' }
          foreach ($tool in $pins.Keys) {
            if ((Get-FileHash -LiteralPath tools\tsmuxer\bin\$tool -Algorithm SHA256).Hash -ne $pins[$tool]) { throw "$tool is not the pinned build" }
          }

      - name: Build, a warning is a failure
        run: dotnet build BurnSmith.slnx -c Release -warnaserror

      # one check a step: a pwsh step reports only the exit code of its last command
      - name: check-update
        run: ./src/BurnSmith.Cli/bin/Release/net10.0-windows/BurnSmith.Cli.exe check-update

      # --no-dvd: the real DVD builds are slow, they run on a PC; each check names what it passes over
      - name: check-edit
        run: ./src/BurnSmith.Cli/bin/Release/net10.0-windows/BurnSmith.Cli.exe check-edit --no-dvd

      - name: check-elements
        run: ./src/BurnSmith.Cli/bin/Release/net10.0-windows/BurnSmith.Cli.exe check-elements

      - name: check-highlights
        run: ./src/BurnSmith.Cli/bin/Release/net10.0-windows/BurnSmith.Cli.exe check-highlights

      # only the templates in git here (built-in and open library), no installed one
      - name: check-templates
        run: ./src/BurnSmith.Cli/bin/Release/net10.0-windows/BurnSmith.Cli.exe check-templates

      # the single pack format: convert the templates in git, then check every pack and what the library offers from it
      - name: check-conversion
        run: |
          ./src/BurnSmith.Cli/bin/Release/net10.0-windows/BurnSmith.Cli.exe convert-templates --force
          ./src/BurnSmith.Cli/bin/Release/net10.0-windows/BurnSmith.Cli.exe check-conversion
          ./src/BurnSmith.Cli/bin/Release/net10.0-windows/BurnSmith.Cli.exe check-library

      # each source template and the pack converted from it draw the same pages, pixel for pixel
      - name: check-fidelity
        run: ./src/BurnSmith.Cli/bin/Release/net10.0-windows/BurnSmith.Cli.exe check-fidelity

      - name: check-bd
        run: ./src/BurnSmith.Cli/bin/Release/net10.0-windows/BurnSmith.Cli.exe check-bd --no-dvd

      - name: check-reliability
        run: ./src/BurnSmith.Cli/bin/Release/net10.0-windows/BurnSmith.Cli.exe check-reliability --no-dvd
